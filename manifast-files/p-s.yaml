apiVersion: apps/v1
kind: Deployment
metadata:
  name: ps
  labels:
    app: ps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ps
  template:
    metadata:
      labels:
        app: ps
    spec:
      containers:
      - name: ps
        image: richardchesterwood/k8s-fleetman-position-simulator:release2-no-websockets
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: production-microservice

